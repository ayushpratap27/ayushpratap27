name: Generate Snake

on:
  schedule:
    # Run every 24 hours
    - cron: "0 0 * * *"
  # Allows manual execution from the Actions tab
  workflow_dispatch:
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generates a snake game from a github user contributions graph and outputs SVGs
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ayushpratap27
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff7a00&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ff7a00&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Push the content of dist/ to the output branch
      # This keeps the main branch history clean of automated commits
      - name: Push files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
